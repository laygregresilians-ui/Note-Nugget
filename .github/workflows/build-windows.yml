name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  UPSTREAM_REPO: DamRsn/NeuralNote
  UPSTREAM_SHA: e6512e384f9f87d5880e71b485f7f78454822ac8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VULKAN_SDK_VERSION: 1.4.363.0
      VULKAN_SDK_SHA256: 94A82D378F7A5E3E54C9DB7D2FB7016AF136E14AC0A18DBF0F2F67A36352D141
      CCACHE_VERSION: 4.14.1
      CCACHE_SHA256: 6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4
      CCACHE_DIR: ${{ github.workspace }}/src/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/src
      CCACHE_MAXSIZE: 2G
      REPO_SLUG: ${{ github.repository }}
    steps:
      - name: NeuralNote à la version figée
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: src
          submodules: true
          persist-credentials: false

      - name: Installer Pillow (pour l'icône)
        run: python -m pip install pillow

      - name: Rebrand
        shell: python {0}
        run: |
          import os
          from pathlib import Path

          NAME = "NoteNugget"
          SLUG = os.environ.get("REPO_SLUG", "OWNER/NoteNugget")
          SRC = Path("src").resolve()


          def edit(rel, pairs):
              path = SRC / rel
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"[rebrand] motif introuvable dans {rel}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print(f"[rebrand] {rel}: {len(pairs)} remplacement(s)")


          edit("CMakeLists.txt", [
              ("project(NeuralNotePlugin VERSION 2.1.0)", "project(NeuralNotePlugin VERSION 1.0.0)"),
              ('COMPANY_NAME "Dr. Audio"', f'COMPANY_NAME "{NAME}"'),
              ('BUNDLE_ID "com.draudio.neuralnote"', 'BUNDLE_ID "com.notenugget.plugin"'),
              ("PLUGIN_MANUFACTURER_CODE DrAu", "PLUGIN_MANUFACTURER_CODE NNug"),
              ("PLUGIN_CODE NRNT", "PLUGIN_CODE NgtP"),
              ('PRODUCT_NAME "NeuralNote"', f'PRODUCT_NAME "{NAME}"'),
          ])

          edit("Lib/Utils/NNFileUtils.cpp", [('.getChildFile("NeuralNote")', f'.getChildFile("{NAME}")')])
          edit("Lib/Utils/NnLogger.cpp", [('getChildFile("NeuralNote.log")', f'getChildFile("{NAME}.log")'),
                                          ('"NeuralNote " + juce::String(ProjectInfo', f'"{NAME} " + juce::String(ProjectInfo')])

          edit("NeuralNote/Source/Components/NeuralNoteMainView.cpp", [
              ("mUpdateCheck->checkForUpdate(false);", "// verification auto des mises a jour desactivee (NoteNugget)"),
          ])
          for rel in ("NeuralNote/Source/Components/UpdateCheck.h", "NeuralNote/Source/Components/UpdateCheck.cpp"):
              text = (SRC / rel).read_text(encoding="utf-8")
              text = text.replace("DamRsn/NeuralNote", SLUG).replace("of NeuralNote", f"of {NAME}")
              (SRC / rel).write_text(text, encoding="utf-8")
          print("[rebrand] UpdateCheck ->", SLUG)

          edit(".github/scripts/configure_and_build.py", [('"-DNEURALNOTE_ASIO=ON"', '"-DNEURALNOTE_ASIO=OFF"')])

          iss = SRC / "Installers" / "Windows" / "neuralnote.iss"
          lines = iss.read_text(encoding="utf-8").splitlines()
          out = []
          for line in lines:
              if line.startswith("AppId="):
                  line = "AppId={{7E2B5C91-4A3D-4F6E-9B1A-5D8C0F3E2A47}"
              elif line.startswith("AppVersion="):
                  line = "AppVersion=1.0.0"
              elif line.startswith("AppPublisher="):
                  line = f"AppPublisher={NAME}"
              elif line.startswith(("AppPublisherURL=", "AppSupportURL=", "AppUpdatesURL=")):
                  line = line.split("=")[0] + f"=https://github.com/{SLUG}"
              elif line.startswith("AppCopyright="):
                  line = "AppCopyright=Based on NeuralNote, Copyright (c) 2026 Damien Ronssin (Apache-2.0)"
              elif "Assets\\Logo" not in line and "NeuralNote_artefacts" not in line:
                  line = line.replace("NeuralNote", NAME).replace("'neuralnote'", f"'{NAME.lower()}'")
              out.append(line)
          text = "\n".join(out) + "\n"
          assert f"{NAME}.vst3" in text and f"{NAME}.exe" in text, "iss: noms de sortie non remplaces"
          iss.write_text(text, encoding="utf-8")
          print("[rebrand] neuralnote.iss")

          from PIL import Image, ImageDraw, ImageFilter
          S = 4096
          img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((0, 0, S - 1, S - 1), radius=S // 5, fill=(24, 22, 30, 255))
          P = lambda pts: [(x * S / 100, y * S / 100) for x, y in pts]
          facets = [
              ([(18, 58), (30, 34), (46, 30), (40, 56)], (176, 124, 20)),
              ([(46, 30), (66, 26), (74, 44), (40, 56)], (232, 176, 44)),
              ([(66, 26), (84, 40), (82, 62), (74, 44)], (200, 142, 28)),
              ([(40, 56), (74, 44), (82, 62), (62, 78)], (244, 196, 70)),
              ([(18, 58), (40, 56), (62, 78), (34, 76)], (190, 132, 24)),
              ([(30, 34), (46, 30), (40, 40)], (255, 226, 130)),
          ]
          for pts, col in facets:
              d.polygon(P(pts), fill=col + (255,))
              d.line(P(pts + [pts[0]]), fill=(120, 80, 10, 255), width=int(S * 0.006), joint="curve")
          d.ellipse(P([(54, 60), (60, 66)]), fill=(255, 244, 200, 235))
          d.rectangle(P([(58.6, 44), (60, 63)]), fill=(255, 244, 200, 235))
          d.polygon(P([(59.6, 44), (68, 49), (68, 53), (59.6, 48)]), fill=(255, 244, 200, 235))
          img = img.filter(ImageFilter.GaussianBlur(S * 0.0008))
          big = img.resize((1024, 1024), Image.LANCZOS)
          logo = SRC / "NeuralNote" / "Assets" / "Logo"
          big.save(str(logo / "neuralnote-1024.png"))
          big.save(str(logo / "NeuralNote.ico"), sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print("[rebrand] icones generees")

      - name: Restore Vulkan SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Set up toolchain
        working-directory: src
        run: python .github/scripts/windows_tools.py

      - name: Restore soundfont
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/NeuralNote/Assets/SoundFont
          key: soundfont-${{ hashFiles('src/Tools/fetch_soundfont.py', 'src/Tools/make_soundfont.py') }}

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/.ccache
          key: ccache-notenugget-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-notenugget-

      - name: Build
        working-directory: src
        run: python .github/scripts/configure_and_build.py

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/.ccache
          key: ccache-notenugget-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package (installeur Inno Setup)
        working-directory: src
        run: python .github/scripts/package_windows.py

      - name: Zip du VST3 seul
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/Installers/Windows/Output/NoteNugget_Installer_Windows_x64.exe dist/
          Compress-Archive -Path "src/build/NeuralNote_artefacts/Release/VST3/NoteNugget.vst3" -DestinationPath dist/NoteNugget_VST3_Windows_x64.zip
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoteNugget-Windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publier la Release (sur tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "NoteNugget ${{ github.ref_name }}" --generate-notes
